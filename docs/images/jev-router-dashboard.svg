<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Jev Router dashboard</title>
  <desc id="desc">A dark dashboard showing routing health, model profiles and decision logs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101426"/><stop offset="1" stop-color="#19112b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6d7cff"/><stop offset="1" stop-color="#9b6dff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="260" fill="#704cff" opacity=".11"/>
  <circle cx="70" cy="610" r="250" fill="#3bc98a" opacity=".07"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#f4f5fb">
    <text x="72" y="70" font-size="16" font-weight="700" letter-spacing="2" fill="#9299b8">AUTOMATIC MODEL ROUTING</text>
    <text x="72" y="118" font-size="42" font-weight="760">Jev Router</text>
    <text x="72" y="151" font-size="18" fill="#aeb4cb">Strong output at the lowest practical usage cost.</text>
    <g transform="translate(72 183)">
      <rect width="346" height="48" rx="13" fill="#20263c" stroke="#3a4058"/>
      <rect x="5" y="5" width="104" height="38" rx="10" fill="url(#accent)"/>
      <text x="30" y="30" font-size="14" font-weight="700">Overview</text>
      <text x="135" y="30" font-size="14" fill="#c0c5d9">Models</text><rect x="194" y="14" width="27" height="20" rx="10" fill="#353b54"/><text x="202" y="29" font-size="11">25</text>
      <text x="247" y="30" font-size="14" fill="#c0c5d9">Logs</text><rect x="287" y="14" width="40" height="20" rx="10" fill="#353b54"/><text x="296" y="29" font-size="11">128</text>
    </g>
    <g transform="translate(72 252)" filter="url(#shadow)">
      <rect width="1056" height="78" rx="16" fill="#172b29" stroke="#31866a"/>
      <circle cx="40" cy="39" r="18" fill="#35b879"/><path d="M32 39l5 5 11-12" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="34" font-size="17" font-weight="700">Routing is ready</text>
      <text x="72" y="57" font-size="14" fill="#a8c7bd">Jev can choose between 3 eligible profiles for this agent.</text>
      <rect x="919" y="23" width="112" height="32" rx="16" fill="#21473d"/><circle cx="940" cy="39" r="5" fill="#45d394"/><text x="954" y="44" font-size="12" font-weight="700" fill="#7ee3b5">LIVE</text>
    </g>
    <g transform="translate(72 350)">
      <g><rect width="330" height="112" rx="15" fill="#171c30" stroke="#30364d"/><text x="20" y="30" font-size="12" font-weight="700" fill="#8f96b2">ROUTING</text><text x="20" y="66" font-size="27" font-weight="760">On</text><text x="20" y="91" font-size="13" fill="#a7adc4">Balanced optimization</text></g>
      <g transform="translate(351)"><rect width="330" height="112" rx="15" fill="#171c30" stroke="#30364d"/><text x="20" y="30" font-size="12" font-weight="700" fill="#8f96b2">READY ROUTES</text><text x="20" y="66" font-size="27" font-weight="760">3 of 3</text><text x="20" y="91" font-size="13" fill="#a7adc4">Available to this agent</text></g>
      <g transform="translate(702)"><rect width="354" height="112" rx="15" fill="#171c30" stroke="#30364d"/><text x="20" y="30" font-size="12" font-weight="700" fill="#8f96b2">GATEWAY MODELS</text><text x="20" y="66" font-size="27" font-weight="760">25</text><text x="20" y="91" font-size="13" fill="#a7adc4">Discovered dynamically</text></g>
    </g>
    <g transform="translate(72 482)">
      <rect width="1056" height="104" rx="16" fill="#151a2c" stroke="#30364d"/>
      <text x="20" y="30" font-size="13" font-weight="700" fill="#8f96b2">ROUTING POOL</text>
      <g transform="translate(20 45)"><rect width="304" height="42" rx="10" fill="#1c2238"/><circle cx="22" cy="21" r="6" fill="#45d394"/><text x="40" y="18" font-size="13" font-weight="700">Routine</text><text x="40" y="33" font-size="11" fill="#939ab5">Low relative cost · Standard quality</text></g>
      <g transform="translate(341 45)"><rect width="304" height="42" rx="10" fill="#1c2238"/><circle cx="22" cy="21" r="6" fill="#7588ff"/><text x="40" y="18" font-size="13" font-weight="700">Balanced</text><text x="40" y="33" font-size="11" fill="#939ab5">Medium cost · Strong quality</text></g>
      <g transform="translate(662 45)"><rect width="374" height="42" rx="10" fill="#1c2238"/><circle cx="22" cy="21" r="6" fill="#b47cff"/><text x="40" y="18" font-size="13" font-weight="700">Deep</text><text x="40" y="33" font-size="11" fill="#939ab5">High relative cost · Best available</text></g>
    </g>
  </g>
</svg>
